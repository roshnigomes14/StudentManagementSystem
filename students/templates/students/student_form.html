{% extends 'students/base.html' %}

{% block content %}

<h2>Add Student</h2>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        Save Student
    </button>

    <a href="{% url 'student_list' %}" class="btn btn-secondary">
        Back
    </a>

</form>

{% endblock %}
